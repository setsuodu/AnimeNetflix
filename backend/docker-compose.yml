version: '3.8'

services:
  # 1. 数据库容器
  anime_db:
    image: postgres:16.4-alpine
    container_name: anime_db
    restart: always
    ports:
      - "9432:5432"  # 宿主机 9432，容器 5432
    environment:
      POSTGRES_USER: netflix
      POSTGRES_PASSWORD: netflix
      POSTGRES_DB: anime_vault
    volumes:
      - ./postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netflix -d anime_vault"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. API 容器 (.NET 10)
  # context = backend/（本文件所在目录），Dockerfile 在项目目录
  anime_api:
    image: ghcr.io/setsuodu/animenetflix:v0.2.2
    container_name: animenetflix
    user: root
    build:
      context: .
      dockerfile: src/Anime.Api/Dockerfile
    ports:
      - "8060:8060"
    depends_on:
      anime_db:
        condition: service_healthy
      nginx:
        condition: service_started
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - TZ=Asia/Shanghai
      - ConnectionStrings__DefaultConnection=Host=anime_db;Port=5432;Database=anime_vault;Username=netflix;Password=netflix

  # 3. Nginx 静态文件服务 (用于封面图)
  nginx:
    image: nginx:alpine
    container_name: anime_nginx
    user: root
    restart: unless-stopped
    ports:
      - "8061:80"
    volumes:
      - ./covers:/usr/share/nginx/html/covers
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    command: ["/bin/sh", "-c", "chmod -R 755 /usr/share/nginx/html/covers && nginx -g 'daemon off;'"]

volumes:
  anime_static:
